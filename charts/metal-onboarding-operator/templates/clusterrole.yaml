{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "metal-onboarding-operator.fullname" . }}
  labels:
    {{- include "metal-onboarding-operator.labels" . | nindent 4 }}
rules:
{{ (.Files.Get "rbac/role.yaml" | fromYaml).rules | toYaml | nindent 0 -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "metal-onboarding-operator.fullname" . }}
  labels:
    {{- include "metal-onboarding-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "metal-onboarding-operator.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "metal-onboarding-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
