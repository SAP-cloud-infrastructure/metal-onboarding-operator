apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metal-onboarding-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metal-onboarding-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "metal-onboarding-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metal-onboarding-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "metal-onboarding-operator.serviceAccountName" . }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --cluster-name={{ required "clusterName is required" .Values.clusterName }}
        - --leader-elect={{ .Values.leaderElect }}
        {{- if .Values.redfishBaseURL }}
        - --redfish-base-url={{ .Values.redfishBaseURL }}
        {{- end }}
        env:
        {{- if .Values.remoteAPIServer }}
        - name: KUBECONFIG
          value: /var/run/remote-kubeconfig/kubeconfig
        {{- end }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.remoteAPIServer }}
        volumeMounts:
        - name: remote-kubeconfig
          mountPath: /var/run/remote-kubeconfig
        - name: remote-serviceaccount
          mountPath: /var/run/secrets/kubernetes.io/remote-serviceaccount
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      {{- if .Values.remoteAPIServer }}
      volumes:
      - name: remote-kubeconfig
        configMap:
          name: {{ .Release.Name }}-remote-kubeconfig
      - name: remote-serviceaccount
        secret:
          secretName: {{ .Release.Name }}-remote-kubeconfig
          items:
          - key: token
            path: token
          - key: bundle.crt
            path: ca.crt
      {{- end }}
      terminationGracePeriodSeconds: 10
