replicaCount: 1

image:
  repository: ghcr.io/sap-cloud-infrastructure/metal-onboarding-operator
  tag: latest
  pullPolicy: IfNotPresent

# Name of the MetalCluster CR that holds the server inventory for this cluster.
# Optional — when empty, label changes on any MetalCluster CR trigger re-enqueuing of all DHCPLeases.
clusterName: ""

# Leader election (disable for local dev)
leaderElect: true

# redfishBaseURL overrides the Redfish endpoint used by the controller.
# When set, all Redfish probes go to this URL instead of https://<lease-IP>.
# Useful in dev environments to point at a fake BMC (e.g. "https://fake-redfish").
redfishBaseURL: ""

serviceAccount:
  create: true
  name: ""

# podLabels are added to the pod template labels. Useful for network policy selectors.
podLabels: {}

# remoteAPIServer enables cross-cluster operation: when set to a <host>:<port>, the operator
# mounts a kubeconfig that points to that API server and sets KUBECONFIG accordingly.
# A ConfigMap named <release-name>-remote-kubeconfig is created with the kubeconfig.
# The token/CA must be injected externally (e.g. via Gardener token-requestor).
remoteAPIServer: ""

rbac:
  # create controls whether ClusterRole and ClusterRoleBinding are created.
  # Set to false when RBAC is managed externally (e.g. via Gardener ManagedResource).
  create: true

# serverReadinessRule controls whether the ServerReadinessRule CR is deployed.
# Requires metal-operator (metal.ironcore.dev/v1alpha1) to be installed in the cluster.
# Set to false if metal-operator is not present or the rule is managed externally.
serverReadinessRule:
  enabled: true

# bmcUserSet controls whether moo creates a BMCUserSet per node alongside the BMC.
# When setupCredentialRef.name is empty (default), no BMCUserSet is created.
bmcUserSet:
  setupCredentialRef:
    name: ""
    namespace: metal-servers
  factoryUserNames: support
  rotationStrategy: DualAccount
  userName: metal
  roleID: Administrator
  rotationPeriod: 720h
  credentialSecretNamespace: metal-servers

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
