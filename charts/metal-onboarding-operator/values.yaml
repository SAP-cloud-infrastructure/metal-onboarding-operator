replicaCount: 1

image:
  repository: ghcr.io/sap-cloud-infrastructure/metal-onboarding-operator
  tag: latest
  pullPolicy: IfNotPresent

# NetBox settings — url is required. A token is optional: NetBox read access is
# unauthenticated, so leave tokenSecret.name empty unless your instance requires auth.
netbox:
  url: ""
  tokenSecret:
    name: ""
    key: token

# Name of this cluster, used by the NetBox provider to gate ClusterGate decisions
clusterName: ""

# Leader election (disable for local dev)
leaderElect: true

# redfishBaseURL overrides the Redfish endpoint used by the controller.
# When set, all Redfish probes go to this URL instead of https://<lease-IP>.
# Useful in dev environments to point at a fake BMC (e.g. "https://fake-redfish").
redfishBaseURL: ""

serviceAccount:
  create: true
  name: ""

# podLabels are added to the pod template labels. Useful for network policy selectors.
podLabels: {}

# remoteAPIServer enables cross-cluster operation: when set to a <host>:<port>, the operator
# mounts a kubeconfig that points to that API server and sets KUBECONFIG accordingly.
# A ConfigMap named <release-name>-remote-kubeconfig is created with the kubeconfig.
# The token/CA must be injected externally (e.g. via Gardener token-requestor).
remoteAPIServer: ""

rbac:
  # create controls whether ClusterRole and ClusterRoleBinding are created.
  # Set to false when RBAC is managed externally (e.g. via Gardener ManagedResource).
  create: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# labelMap maps Kubernetes label keys to dot-separated NetBox device JSON paths.
# The entries below mirror the hardcoded defaults already applied by the operator.
# Add extra entries here for any additional NetBox fields you want as labels.
# Note: kubernetes.metal.cloud.sap/nodename and /bb are derived by splitting the
# device name on "-" and cannot be expressed as JSON paths.
labelMap:
  topology.kubernetes.io/region: site.region.slug
  topology.kubernetes.io/zone: site.slug
  kubernetes.metal.cloud.sap/cluster: cluster.name
  kubernetes.metal.cloud.sap/cluster-type: cluster.type.slug
  kubernetes.metal.cloud.sap/name: name
  kubernetes.metal.cloud.sap/type: device_type.slug
  kubernetes.metal.cloud.sap/role: device_role.slug
  kubernetes.metal.cloud.sap/platform: platform.slug
