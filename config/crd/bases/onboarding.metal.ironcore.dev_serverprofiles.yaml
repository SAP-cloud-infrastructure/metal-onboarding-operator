---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: serverprofiles.onboarding.metal.ironcore.dev
spec:
  group: onboarding.metal.ironcore.dev
  names:
    kind: ServerProfile
    listKind: ServerProfileList
    plural: serverprofiles
    singular: serverprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.macAddress
      name: MAC
      type: string
    - jsonPath: .spec.serverName
      name: ServerName
      type: string
    - jsonPath: .spec.oobIP
      name: OOBIP
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServerProfile is the Schema for the serverprofiles API.
          It provides CRD-backed inventory data for the InventoryProvider interface,
          used when NetBox is not available.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServerProfileSpec defines the desired state of ServerProfile.
              One ServerProfile entry per physical server; used by the CRD inventory provider
              as a fallback when NetBox is not configured.
            properties:
              bmcHostname:
                description: |-
                  bmcHostname is the optional DNS name for the remoteboard/BMC interface.
                  When set, it is applied to BMC.spec.hostname.
                type: string
              clusterName:
                description: |-
                  clusterName identifies which cluster this server belongs to.
                  Used to gate onboarding: a server with a different clusterName is marked Skipped.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: |-
                  labels are topology and cluster labels to be applied to the BMC object metadata.
                  These supplement or override defaults from SiteConfig.
                type: object
              macAddress:
                description: macAddress is the OOB interface MAC address used to match
                  incoming DHCPLease CRs.
                pattern: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
                type: string
              oobIP:
                description: oobIP is the static OOB IP address for this server's
                  BMC.
                type: string
              serverName:
                description: |-
                  serverName is the canonical name for this server, used as the BMC object name.
                  Should match the naming convention used in NetBox (e.g. "r-abc12-bb01").
                type: string
              siteConfigRef:
                description: |-
                  siteConfigRef references the SiteConfig CR that provides cluster-wide defaults.
                  Fields from SiteConfig are used when clusterName is not set directly.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - macAddress
            - oobIP
            - serverName
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
